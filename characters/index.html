<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>人物之间 · 文学关系图谱</title><meta name="description" content="搜索文学人物，探索人物关系，并创建自己的阅读图谱。"><link rel="stylesheet" href="style.css"><link rel="icon" href="../assets/favicon.svg"></head>
<body><header><a class="brand" href="../index.html"><b>文</b> 人物之间 <small>文学关系图谱</small></a><a href="../index.html">返回作品集 ↗</a></header>
<main><div class="heading"><div><p class="eyebrow">READ BETWEEN THE CHARACTERS</p><h1>读懂人物之间的线索。</h1><p>从一个人物出发，展开一本书的世界。</p></div><div class="actions"><button id="export">导出图谱</button><label class="upload">导入 JSON<input id="import" type="file" accept=".json,application/json"></label><button id="new">新建图谱</button></div></div>
<div class="workspace"><aside class="library"><label>当前作品<select id="book"><option value="sample">红楼梦 · 第三回选读</option><option value="custom">我的阅读图谱</option></select></label><label>搜索人物<input id="search" type="search" placeholder="输入姓名…"></label><label>关系类型<select id="filter"><option value="all">全部关系</option><option>亲属</option><option>婚姻</option><option>交往</option></select></label><p id="count" class="muted"></p><div id="people" class="people"></div><p class="hint">点击人物聚焦关系。图谱支持拖动人物和缩放；人物列表也可用键盘操作。</p></aside>
<section class="canvas" aria-label="人物关系图"><div class="canvas-top"><strong id="bookTitle"></strong><span>亲属 <i class="kin"></i> 婚姻 <i class="marriage"></i> 交往 <i class="social"></i></span></div><svg id="graph" viewBox="0 0 800 620" role="img" aria-label="人物关系网络；详细关系也在右侧文字面板列出"></svg><p id="empty" hidden>没有匹配的人物。试试其他姓名，或添加第一个人物。</p><div class="zoom"><button id="out" aria-label="缩小">−</button><button id="reset">重置视图</button><button id="in" aria-label="放大">＋</button><button id="clear">取消聚焦</button></div></section>
<aside class="detail"><p class="eyebrow">CHARACTER NOTES</p><h2 id="personTitle">选择一个人物</h2><p id="bio">查看人物简介与关系说明。</p><div id="relations"></div><details><summary>编辑人物与关系</summary><p class="hint">修改示例会保存为“我的阅读图谱”。数据保存在此浏览器，请导出备份。</p><form id="personForm"><label>姓名<input id="name" required maxlength="20"></label><label>阅读笔记<textarea id="note" maxlength="600" rows="3"></textarea></label><button class="primary">保存人物</button><button type="button" id="delete">删除所选人物</button></form><form id="edgeForm"><h3>添加关系</h3><label>人物一<select id="from" required></select></label><label>人物二<select id="to" required></select></label><label>类型<select id="type"><option>亲属</option><option>婚姻</option><option>交往</option></select></label><label>关系说明<input id="label" required maxlength="80" placeholder="如：贾母是林黛玉的外祖母"></label><button class="primary">添加关系</button></form></details></aside></div>
<footer><span id="status" role="status" aria-live="polite">示例只收录部分人物与关系，不是完整人物谱。</span><a href="https://zh.wikisource.org/wiki/紅樓夢/第003回" target="_blank" rel="noopener noreferrer">示例依据：《红楼梦》第三回 ↗</a></footer></main><script src="app.js" defer></script></body></html>
